{% extends "base.html" %}
{% block title %}Chef Chat — Create Account{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-6">
  <div class="bg-surface-container-lowest rounded-2xl p-6 md:p-8 ambient-shadow border border-outline-variant/30 text-center">
    
    <div class="w-12 h-12 rounded-full bg-primary/10 text-primary mx-auto flex items-center justify-center mb-3">
      <span class="material-symbols-outlined text-[28px]">person_add</span>
    </div>

    <h1 class="font-headline text-2xl md:text-3xl font-bold text-on-surface mb-1">Create Account</h1>
    <p class="text-xs text-on-surface-variant mb-6">One account per household — shared kitchen menu and pantry.</p>

    {% if error %}
      <div class="bg-rose-50 border border-rose-200 text-rose-800 px-4 py-2.5 rounded-xl text-xs font-semibold mb-4 text-left">
        {{ error }}
      </div>
    {% endif %}

    <form method="post" action="/signup" class="space-y-3.5 text-left m-0">
      <div>
        <label for="email" class="block text-xs font-semibold text-on-surface mb-1">Account Email</label>
        <input type="email" id="email" name="email" value="{{ email }}" required placeholder="you@example.com" class="w-full text-xs p-2.5 rounded-xl border border-outline-variant/60 focus:ring-1 focus:ring-primary focus:border-primary">
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold text-on-surface mb-1">Password</label>
        <input type="password" id="password" name="password" minlength="8" required placeholder="At least 8 characters" class="w-full text-xs p-2.5 rounded-xl border border-outline-variant/60 focus:ring-1 focus:ring-primary focus:border-primary">
      </div>

      <div>
        <label for="confirm" class="block text-xs font-semibold text-on-surface mb-1">Confirm Password</label>
        <input type="password" id="confirm" name="confirm" minlength="8" required placeholder="Repeat password" class="w-full text-xs p-2.5 rounded-xl border border-outline-variant/60 focus:ring-1 focus:ring-primary focus:border-primary">
      </div>

      <div>
        <label for="security_question" class="block text-xs font-semibold text-on-surface mb-1">Security Question (Password Recovery)</label>
        <select id="security_question" name="security_question" required class="w-full text-xs p-2.5 rounded-xl border border-outline-variant/60 bg-white focus:ring-1 focus:ring-primary focus:border-primary">
          <option value="">-- Select a Question --</option>
          <option value="What is your favorite home-cooked dish?">What is your favorite home-cooked dish?</option>
          <option value="What city were you born in?">What city were you born in?</option>
          <option value="What was the name of your first pet?">What was the name of your first pet?</option>
          <option value="What is your mother's maiden name?">What is your mother's maiden name?</option>
        </select>
      </div>

      <div>
        <label for="security_answer" class="block text-xs font-semibold text-on-surface mb-1">Security Answer</label>
        <input type="text" id="security_answer" name="security_answer" required placeholder="Your secret answer (case-insensitive)" class="w-full text-xs p-2.5 rounded-xl border border-outline-variant/60 focus:ring-1 focus:ring-primary focus:border-primary">
      </div>

      <button type="submit" class="w-full bg-primary hover:bg-primary-container text-white text-xs font-bold py-3 rounded-xl shadow-md transition-all flex items-center justify-center space-x-1 mt-4">
        <span>Create Account</span>
        <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
      </button>
    </form>

    <div class="mt-6 pt-4 border-t border-outline-variant/20 text-center text-xs text-on-surface-variant">
      Already have an account? <a href="/login" class="text-primary font-bold hover:underline">Log in</a>
    </div>

  </div>
</div>
{% endblock %}
