{% extends "base.html" %}
{% block title %}Chef Chat — Kitchen Setup & Preferences{% endblock %}

{% block extra_style %}
<style>
  .setup-pill {
    cursor: pointer;
    transition: all 0.2s ease;
  }
  input[type="radio"]:checked + label {
    background-color: #aa3424;
    color: #ffffff;
    border-color: #aa3424;
    box-shadow: 0 4px 10px rgba(170, 52, 36, 0.2);
  }
</style>
{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto py-6">
  <div class="bg-surface-container-lowest rounded-2xl p-6 md:p-8 ambient-shadow border border-outline-variant/30">
    
    <div class="text-center mb-6">
      <div class="w-12 h-12 rounded-full bg-primary/10 text-primary mx-auto flex items-center justify-center mb-2">
        <span class="material-symbols-outlined text-[28px]">tune</span>
      </div>
      <h1 class="font-headline text-2xl md:text-3xl font-bold text-on-surface mb-1">Chef Chat Setup</h1>
      <p class="text-xs text-on-surface-variant">A 60-second setup saves daily "what should I cook" stress forever.</p>
    </div>

    <form method="post" action="/quiz" class="space-y-6 m-0">

      <!-- Daily Cooking -->
      <div>
        <label class="block text-xs font-bold text-on-surface mb-2">Do you cook daily?</label>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <input type="radio" id="cd_yes" name="cooks_daily" value="yes" required class="hidden">
            <label for="cd_yes" class="setup-pill block text-center py-2.5 px-4 rounded-xl border border-outline-variant/60 text-xs font-semibold text-on-surface bg-surface-container-low">Yes, daily</label>
          </div>
          <div>
            <input type="radio" id="cd_no" name="cooks_daily" value="no" class="hidden">
            <label for="cd_no" class="setup-pill block text-center py-2.5 px-4 rounded-xl border border-outline-variant/60 text-xs font-semibold text-on-surface bg-surface-container-low">No, few days</label>
          </div>
        </div>
      </div>

      <!-- Decision Help -->
      <div>
        <label class="block text-xs font-bold text-on-surface mb-2">Would you like automated dinner suggestions every day?</label>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <input type="radio" id="ws_yes" name="wants_suggestions" value="yes" required class="hidden" checked>
            <label for="ws_yes" class="setup-pill block text-center py-2.5 px-4 rounded-xl border border-outline-variant/60 text-xs font-semibold text-on-surface bg-surface-container-low">Yes, please! ✨</label>
          </div>
          <div>
            <input type="radio" id="ws_no" name="wants_suggestions" value="no" class="hidden">
            <label for="ws_no" class="setup-pill block text-center py-2.5 px-4 rounded-xl border border-outline-variant/60 text-xs font-semibold text-on-surface bg-surface-container-low">I'll pick myself</label>
          </div>
        </div>
      </div>

      <!-- Diet Pattern -->
      <div>
        <label class="block text-xs font-bold text-on-surface mb-2">What is your household's diet pattern?</label>
        <div class="grid grid-cols-3 gap-2">
          <div>
            <input type="radio" id="dt_veg" name="diet_type" value="veg" required class="hidden">
            <label for="dt_veg" class="setup-pill block text-center py-2.5 px-3 rounded-xl border border-outline-variant/60 text-xs font-semibold text-on-surface bg-surface-container-low">Non-Meat 🥦</label>
          </div>
          <div>
            <input type="radio" id="dt_nonveg" name="diet_type" value="nonveg" class="hidden" checked>
            <label for="dt_nonveg" class="setup-pill block text-center py-2.5 px-3 rounded-xl border border-outline-variant/60 text-xs font-semibold text-on-surface bg-surface-container-low">Meat 🍗</label>
          </div>
          <div>
            <input type="radio" id="dt_alt" name="diet_type" value="alternate" class="hidden">
            <label for="dt_alt" class="setup-pill block text-center py-2.5 px-3 rounded-xl border border-outline-variant/60 text-xs font-semibold text-on-surface bg-surface-container-low">Alternate 🔄</label>
          </div>
        </div>
        <div id="diet_rule_wrap" class="hidden mt-2">
          <input type="text" name="diet_rule" placeholder="e.g. meat on weekends only" class="w-full text-xs p-2.5 rounded-xl border border-outline-variant/60 focus:ring-1 focus:ring-primary">
        </div>
      </div>

      <!-- Household Size & WhatsApp Number -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-on-surface mb-1">Household Size (People)</label>
          <input type="number" name="household_size" min="1" value="4" required class="w-full text-xs p-2.5 rounded-xl border border-outline-variant/60 focus:ring-1 focus:ring-primary">
        </div>
        <div>
          <label class="block text-xs font-bold text-on-surface mb-1">WhatsApp Number (For Alerts)</label>
          <input type="tel" name="wa_id" placeholder="e.g. 923232459573" required class="w-full text-xs p-2.5 rounded-xl border border-outline-variant/60 focus:ring-1 focus:ring-primary">
          <span class="text-[10px] text-on-surface-variant block mt-0.5">Country code without + or spaces.</span>
        </div>
      </div>

      <!-- Health vs Indulgent -->
      <div>
        <label class="block text-xs font-bold text-on-surface mb-2">Cooking Style Preference</label>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <input type="radio" id="hc_healthy" name="health_conscious" value="healthy" required class="hidden" checked>
            <label for="hc_healthy" class="setup-pill block text-center py-2.5 px-4 rounded-xl border border-outline-variant/60 text-xs font-semibold text-on-surface bg-surface-container-low">Light & Healthy 🥗</label>
          </div>
          <div>
            <input type="radio" id="hc_indulgent" name="health_conscious" value="indulgent" class="hidden">
            <label for="hc_indulgent" class="setup-pill block text-center py-2.5 px-4 rounded-xl border border-outline-variant/60 text-xs font-semibold text-on-surface bg-surface-container-low">Rich & Desi Gravy 🧈</label>
          </div>
        </div>
      </div>

      <!-- History tracking -->
      <div>
        <label class="block text-xs font-bold text-on-surface mb-2">Track 60-Day Rotation History?</label>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <input type="radio" id="th_yes" name="track_history" value="yes" required class="hidden" checked>
            <label for="th_yes" class="setup-pill block text-center py-2.5 px-4 rounded-xl border border-outline-variant/60 text-xs font-semibold text-on-surface bg-surface-container-low">Yes (Anti-Repetition) 🛡️</label>
          </div>
          <div>
            <input type="radio" id="th_no" name="track_history" value="no" class="hidden">
            <label for="th_no" class="setup-pill block text-center py-2.5 px-4 rounded-xl border border-outline-variant/60 text-xs font-semibold text-on-surface bg-surface-container-low">No preference</label>
          </div>
        </div>
      </div>

      <button type="submit" class="w-full bg-primary hover:bg-primary-container text-white text-xs font-bold py-3.5 rounded-xl shadow-md transition-all flex items-center justify-center space-x-1.5 pt-3">
        <span class="material-symbols-outlined text-[18px]">check_circle</span>
        <span>Save Preferences & Start Cooking</span>
      </button>

    </form>

  </div>
</div>

<script>
  const dietRadios = document.querySelectorAll('input[name="diet_type"]');
  const ruleWrap = document.getElementById('diet_rule_wrap');
  function toggleRule() {
    const checked = document.querySelector('input[name="diet_type"]:checked');
    if (checked && checked.value === 'alternate') {
      ruleWrap.classList.remove('hidden');
    } else {
      ruleWrap.classList.add('hidden');
    }
  }
  dietRadios.forEach(r => r.addEventListener('change', toggleRule));
  toggleRule();
</script>
{% endblock %}
