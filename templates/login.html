{% extends "base.html" %}
{% block title %}Chef Chat — Log In{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-6">
  <div class="bg-surface-container-lowest rounded-2xl p-6 md:p-8 ambient-shadow border border-outline-variant/30 text-center">
    
    <div class="w-12 h-12 rounded-full bg-primary/10 text-primary mx-auto flex items-center justify-center mb-3">
      <span class="material-symbols-outlined text-[28px]">lock_open</span>
    </div>

    <h1 class="font-headline text-2xl md:text-3xl font-bold text-on-surface mb-1">Welcome Back</h1>
    <p class="text-xs text-on-surface-variant mb-6">Log in to view today's dinner recommendation.</p>

    {% if error %}
      <div class="bg-rose-50 border border-rose-200 text-rose-800 px-4 py-2.5 rounded-xl text-xs font-semibold mb-4 text-left">
        {{ error }}
      </div>
    {% endif %}

    <form method="post" action="/login" class="space-y-4 text-left m-0">
      <div>
        <label for="email" class="block text-xs font-semibold text-on-surface mb-1">Account Email</label>
        <input type="email" id="email" name="email" value="{{ email }}" required placeholder="you@example.com" class="w-full text-xs p-2.5 rounded-xl border border-outline-variant/60 focus:ring-1 focus:ring-primary focus:border-primary">
      </div>

      <div>
        <div class="flex items-center justify-between mb-1">
          <label for="password" class="block text-xs font-semibold text-on-surface">Password</label>
          <a href="/forgot_password" class="text-[11px] font-bold text-primary hover:underline">Forgot password?</a>
        </div>
        <input type="password" id="password" name="password" required placeholder="••••••••" class="w-full text-xs p-2.5 rounded-xl border border-outline-variant/60 focus:ring-1 focus:ring-primary focus:border-primary">
      </div>

      <button type="submit" class="w-full bg-primary hover:bg-primary-container text-white text-xs font-bold py-3 rounded-xl shadow-md transition-all flex items-center justify-center space-x-1">
        <span>Log in</span>
        <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
      </button>
    </form>

    <div class="mt-6 pt-4 border-t border-outline-variant/20 text-center text-xs text-on-surface-variant">
      New to Chef Chat? <a href="/signup" class="text-primary font-bold hover:underline">Create an account</a>
    </div>

  </div>
</div>
{% endblock %}
